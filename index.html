<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="GiftLab-kst - конструктор подарков из сушёных фруктов и орехов">
    <meta name="theme-color" content="#1A3021">
    <title>GiftLab-kst</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        html { scroll-behavior: smooth; }
        body { background-color: #F8F5F0; color: #1A3021; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .glass { background: rgba(255,255,255,0.95); border: 1px solid rgba(255,255,255,0.6); border-radius: 1.5rem; }
        .btn-main { background: #1A3021; color: #F5EDD8; transition: all 0.3s; font-weight: 700; }
        .btn-main:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(26,48,33,0.2); }
        .btn-main:active { transform: scale(0.96); }
        .progress { transition: width 0.6s ease; background: linear-gradient(90deg, #1A3021 0%, #2d4a35 100%); }
        .progress.full { background: linear-gradient(90deg, #10b981 0%, #059669 100%); }
        .box-selected { border: 2px solid #1A3021; background: #f0f2f0; transform: translateY(-2px); box-shadow: 0 8px 20px rgba(26,48,33,0.15); }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .fade-in { animation: fadeIn 0.3s ease; }
        .slide-up { animation: slideUp 0.3s ease; }
    </style>
</head>
<body class="pb-40">

    <!-- МОДАЛЬНОЕ ОКНО -->
    <div id="modal" class="hidden fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4">
        <div class="glass bg-white p-6 max-w-sm w-full slide-up">
            <button onclick="closeModal()" class="float-right text-2xl text-gray-400 hover:text-gray-600">×</button>
            <div class="clear-both text-center">
                <div id="modalIcon" class="text-5xl mb-3">🎁</div>
                <h3 id="modalTitle" class="text-2xl font-bold mb-2">Товар</h3>
                <p id="modalDesc" class="text-gray-600 text-sm mb-4"></p>
                <div class="bg-gray-100 rounded-xl p-4 mb-3">
                    <div class="text-xs text-gray-500 mb-1">Цена за 100г: <span id="modalPrice">0</span> ₸</div>
                    <div class="text-sm mb-2">Ваша порция: <span id="modalQty">100</span>г</div>
                    <div class="text-xl font-bold">Итого: <span id="modalTotal">0</span> ₸</div>
                </div>
            </div>
        </div>
    </div>

    <!-- HEADER -->
    <div class="bg-gradient-to-r from-[#1A3021] to-[#2d4a35] text-white pt-12 pb-20 px-4 text-center">
        <h1 class="text-4xl font-bold mb-2">GiftLab-kst</h1>
        <p class="text-sm opacity-80">Конструктор подарков из сушёных фруктов</p>
    </div>

    <div class="max-w-2xl mx-auto px-4 -mt-8 relative z-10">

        <!-- КОРОБКИ -->
        <div class="glass p-5 mb-6 fade-in">
            <h2 class="font-bold text-lg mb-4">Выберите коробку</h2>
            <div class="grid grid-cols-2 gap-3" id="boxGrid"></div>
        </div>

        <!-- ПРОГРЕСС БАР -->
        <div class="glass p-4 mb-6 sticky top-4 z-40 fade-in">
            <div class="flex justify-between text-xs mb-2 font-bold opacity-60">
                <span>Заполнение: <span id="progressText">0</span>%</span>
                <span id="weightText">0г / 200г</span>
            </div>
            <div class="w-full h-3 bg-gray-200 rounded-full overflow-hidden">
                <div id="progressBar" class="progress h-full w-0"></div>
            </div>
        </div>

        <!-- ТОВАРЫ -->
        <div class="glass p-5 mb-6 fade-in">
            <h2 class="font-bold text-lg mb-6">Добавьте товары</h2>
            <div id="productsContainer" class="space-y-8"></div>
        </div>

    </div>

    <!-- FOOTER -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t p-4 z-50">
        <div class="max-w-2xl mx-auto flex justify-between items-center">
            <div>
                <div class="text-xs opacity-50">К оплате</div>
                <div class="text-3xl font-bold" id="totalPrice">0 ₸</div>
            </div>
            <button onclick="sendOrder()" class="btn-main px-6 py-3 rounded-lg">Заказать</button>
        </div>
    </div>

    <script>
        const config = { phone: '77712445164', step: 25 };

        const boxes = [
            { id: 'mini', name: 'Мини', limit: 200, price: 500 },
            { id: 'mid', name: 'Средняя', limit: 350, price: 700 },
            { id: 'big', name: 'Большая', limit: 500, price: 900 },
            { id: 'max', name: 'Килограмм', limit: 1000, price: 1400 }
        ];

        const products = [
            {
                category: 'Премиум выбор',
                items: [
                    { name: 'Ананас', price: 1500, desc: 'Натуральный вяленый ананас кольцами' },
                    { name: 'Миндаль', price: 1500, desc: 'Крупный жареный миндаль' },
                    { name: 'Миндаль в шоколаде', price: 1500, desc: 'Миндаль в молочном шоколаде' },
                    { name: 'Клубника', price: 1200, desc: 'Вяленая клубника без сахара' },
                    { name: 'Макадамия', price: 1200, desc: 'Нежный орех со сливочным вкусом' }
                ]
            },
            {
                category: 'Тропики и Орехи',
                items: [
                    { name: 'Грецкий орех', price: 1300, desc: 'Отборные половинки грецкого ореха' },
                    { name: 'Маракуйя', price: 1000, desc: 'Экзотическая вяленая маракуйя' },
                    { name: 'Вишня', price: 1000, desc: 'Вишня вяленая без косточек' },
                    { name: 'Киви', price: 1000, desc: 'Яркие дольки вяленого киви' },
                    { name: 'Дыня', price: 900, desc: 'Традиционные дынные палочки' }
                ]
            },
            {
                category: 'Снеки и Сладости',
                items: [
                    { name: 'Банановые чипсы', price: 900, desc: 'Тонкие ломтики банана' },
                    { name: 'Цукаты ассорти', price: 900, desc: 'Смесь натуральных цукатов' },
                    { name: 'Курага', price: 900, desc: 'Янтарная курага высшего качества' },
                    { name: 'Набат', price: 400, desc: 'Кристаллический сахар на нитях' },
                    { name: 'Арахис', price: 350, desc: 'Жареный арахис высшего качества' }
                ]
            }
        ];

        let selectedBox = boxes[0];
        let cart = {};

        function init() {
            renderBoxes();
            renderProducts();
            updateUI();
        }

        function renderBoxes() {
            const html = boxes.map(b => `
                <div onclick="selectBox('${b.id}')" class="p-3 border-2 rounded-lg text-center cursor-pointer transition-all ${selectedBox.id === b.id ? 'box-selected' : 'border-gray-300 hover:border-gray-400'}">
                    <div class="font-bold">${b.name}</div>
                    <div class="text-xs opacity-60">${b.limit}г</div>
                </div>
            `).join('');
            document.getElementById('boxGrid').innerHTML = html;
        }

        function renderProducts() {
            const html = products.map(cat => `
                <div>
                    <div class="text-xs font-bold text-gray-500 mb-3 uppercase">${cat.category}</div>
                    ${cat.items.map(item => `
                        <div class="flex justify-between items-center py-2 border-b hover:bg-gray-50 px-2 rounded cursor-pointer" onclick="openModal('${item.name}')">
                            <div class="flex-1">
                                <div class="font-semibold text-sm">${item.name}</div>
                                <div class="text-xs text-gray-500">${item.price} ₸/100г</div>
                            </div>
                            <div class="flex items-center gap-2">
                                <button onclick="event.stopPropagation(); changeQty('${item.name}', -${config.step})" class="w-7 h-7 bg-gray-200 rounded hover:bg-gray-300 text-sm font-bold">−</button>
                                <span class="w-10 text-center text-xs font-bold">${cart[item.name] || 0}г</span>
                                <button onclick="event.stopPropagation(); changeQty('${item.name}', ${config.step})" class="w-7 h-7 bg-gray-200 rounded hover:bg-gray-300 text-sm font-bold">+</button>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `).join('');
            document.getElementById('productsContainer').innerHTML = html;
        }

        function selectBox(id) {
            const box = boxes.find(b => b.id === id);
            const weight = Object.values(cart).reduce((a, b) => a + b, 0);
            if (weight > box.limit) {
                alert(`Вес ${weight}г не подходит для коробки "${box.name}"`);
                return;
            }
            selectedBox = box;
            renderBoxes();
            updateUI();
        }

        function changeQty(name, delta) {
            const total = Object.values(cart).reduce((a, b) => a + b, 0);
            const current = cart[name] || 0;
            if (delta > 0 && total + delta > selectedBox.limit) {
                alert('Коробка полная!');
                return;
            }
            const next = current + delta;
            if (next > 0) {
                cart[name] = next;
            } else {
                delete cart[name];
            }
            renderProducts();
            updateUI();
        }

        function updateUI() {
            let weight = 0, price = selectedBox.price;
            Object.entries(cart).forEach(([name, qty]) => {
                const item = products.flatMap(c => c.items).find(i => i.name === name);
                weight += qty;
                price += (item.price / 100) * qty;
            });
            const percent = Math.round((weight / selectedBox.limit) * 100);
            document.getElementById('progressBar').style.width = percent + '%';
            document.getElementById('progressBar').classList.toggle('full', percent === 100);
            document.getElementById('progressText').innerText = Math.min(100, percent);
            document.getElementById('weightText').innerText = weight + 'г / ' + selectedBox.limit + 'г';
            document.getElementById('totalPrice').innerText = Math.round(price) + ' ₸';
        }

        function openModal(name) {
            const item = products.flatMap(c => c.items).find(i => i.name === name);
            const qty = cart[name] || 100;
            document.getElementById('modalTitle').innerText = item.name;
            document.getElementById('modalDesc').innerText = item.desc;
            document.getElementById('modalPrice').innerText = item.price;
            document.getElementById('modalQty').innerText = qty;
            document.getElementById('modalTotal').innerText = Math.round((item.price / 100) * qty);
            document.getElementById('modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
        }

        function sendOrder() {
            const weight = Object.values(cart).reduce((a, b) => a + b, 0);
            if (weight === 0) {
                alert('Добавьте товары!');
                return;
            }
            let msg = '*🎁 Заказ GiftLab-kst*\n';
            msg += 'Коробка: ' + selectedBox.name + '\n';
            msg += 'Вес: ' + weight + 'г\n\n';
            let total = selectedBox.price;
            Object.entries(cart).forEach(([name, qty]) => {
                const item = products.flatMap(c => c.items).find(i => i.name === name);
                msg += '• ' + name + ': ' + qty + 'г\n';
                total += (item.price / 100) * qty;
            });
            msg += '\nИтого: ' + Math.round(total) + ' ₸';
            window.open('https://wa.me/' + config.phone + '?text=' + encodeURIComponent(msg), '_blank');
        }

        init();
    </script>

</body>
</html>
